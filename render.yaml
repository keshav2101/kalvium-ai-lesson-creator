services:
  - type: web
    name: kalvium-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GOOGLE_CSE_API_KEY
        sync: false          # optional — enables live web search
      - key: GOOGLE_CSE_ID
        sync: false          # optional — enables live web search
      - key: CORS_ORIGINS
        sync: false          # paste your Vercel frontend URL here, e.g. https://my-app.vercel.app
    healthCheckPath: /api/health

